<script>
    document.addEventListener('DOMContentLoaded', () => {
        const socialBtns = document.querySelectorAll('.social-btn');
        const toast = document.getElementById('social-toast');
        const toastMessage = document.getElementById('toast-message');
        const toastSpinner = document.getElementById('toast-spinner');

        socialBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const provider = btn.getAttribute('data-provider');
                if (!toast) return;

                // Show toast
                toastMessage.textContent = `Connecting to ${provider}...`;
                toastSpinner.classList.add('animate-spin');
                toastSpinner.textContent = 'sync';
                toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');

                setTimeout(() => {
                    toastMessage.textContent = `Successfully logged in via ${provider}!`;
                    toastSpinner.classList.remove('animate-spin');
                    toastSpinner.textContent = 'check_circle';
                    
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1200);
                }, 1500);
            });
        });
    });

        // RTL Toggle Logic
        const rtlToggle = document.getElementById('rtl-toggle');
        if (rtlToggle) {
            rtlToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.getAttribute('dir') === 'rtl') {
                    html.setAttribute('dir', 'ltr');
                } else {
                    html.setAttribute('dir', 'rtl');
                }
            });
        }
</script>

    <script>
        (function() {
            const toggle = document.getElementById('theme-toggle');
            
            // Set initial icon based on current theme from localStorage/system
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (toggle) {
                const icon = toggle.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.textContent = isDark ? 'dark_mode' : 'light_mode';
                    icon.setAttribute('data-icon', isDark ? 'dark_mode' : 'light_mode');
                }
                
                toggle.addEventListener('click', () => {
                    html.classList.toggle('dark');
                    html.classList.toggle('light');
                    const isDarkNow = html.classList.contains('dark');
                    localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
                    
                    if (icon) {
                        icon.textContent = isDarkNow ? 'dark_mode' : 'light_mode';
                        icon.setAttribute('data-icon', isDarkNow ? 'dark_mode' : 'light_mode');
                    }
                });
            }
        })();
    </script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        
    });

        // RTL Toggle Logic
        const rtlToggle = document.getElementById('rtl-toggle');
        if (rtlToggle) {
            rtlToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.getAttribute('dir') === 'rtl') {
                    html.setAttribute('dir', 'ltr');
                } else {
                    html.setAttribute('dir', 'rtl');
                }
            });
        }
</script>

    <script>
        (function() {
            const toggle = document.getElementById('theme-toggle');
            
            // Set initial icon based on current theme from localStorage/system
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (toggle) {
                const icon = toggle.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.textContent = isDark ? 'dark_mode' : 'light_mode';
                    icon.setAttribute('data-icon', isDark ? 'dark_mode' : 'light_mode');
                }
                
                toggle.addEventListener('click', () => {
                    html.classList.toggle('dark');
                    html.classList.toggle('light');
                    const isDarkNow = html.classList.contains('dark');
                    localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
                    
                    if (icon) {
                        icon.textContent = isDarkNow ? 'dark_mode' : 'light_mode';
                        icon.setAttribute('data-icon', isDarkNow ? 'dark_mode' : 'light_mode');
                    }
                });
            }
        })();
    </script>

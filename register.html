<script>
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        const icon = document.getElementById('theme-icon');
        if (icon) {
            icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        }
    }

        // RTL Toggle Logic
        const rtlToggle = document.getElementById('rtl-toggle');
        if (rtlToggle) {
            rtlToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.getAttribute('dir') === 'rtl') {
                    html.setAttribute('dir', 'ltr');
                } else {
                    html.setAttribute('dir', 'rtl');
                }
            });
        }
</script>

<script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
    } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');

    <script>
        (function() {
            const toggle = document.getElementById('theme-toggle');
            
            // Set initial icon based on current theme from localStorage/system
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (toggle) {
                const icon = toggle.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.textContent = isDark ? 'dark_mode' : 'light_mode';
                    icon.setAttribute('data-icon', isDark ? 'dark_mode' : 'light_mode');
                }
                
                toggle.addEventListener('click', () => {
                    html.classList.toggle('dark');
                    html.classList.toggle('light');
                    const isDarkNow = html.classList.contains('dark');
                    localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
                    
                    if (icon) {
                        icon.textContent = isDarkNow ? 'dark_mode' : 'light_mode';
                        icon.setAttribute('data-icon', isDarkNow ? 'dark_mode' : 'light_mode');
                    }
                });
            }
        })();
    </script>
